<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Copy Estratega · QR · Tarjeta imprimible</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,400;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    :root {
      --black:   #060606;
      --ink:     #f3ede4;
      --ink-dim: #b6ada1;
      --muted:   #6e655b;
      --gold:    #c9a84c;
      --gold-hi: #e6c97a;
      --gold-lo: #8a7129;
      --line:    rgba(201, 168, 76, 0.18);
    }

    html, body {
      background: #1a1a1a;
      color: var(--ink);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      min-height: 100vh;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 210mm;
      height: 297mm;
      padding: 28mm 22mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: var(--black);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 80px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(201,168,76,0.08);
      flex-shrink: 0;
    }

    /* Subtle gold glow background */
    .card::before {
      content: '';
      position: absolute;
      top: -120mm;
      left: 50%;
      transform: translateX(-50%);
      width: 240mm;
      height: 240mm;
      background: radial-gradient(circle at center, rgba(201,168,76,0.12) 0%, rgba(201,168,76,0.04) 35%, transparent 65%);
      pointer-events: none;
    }
    .card > * { position: relative; z-index: 1; }

    /* TOP */
    .top {
      width: 100%;
      text-align: center;
      padding-top: 6mm;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 18pt;
      letter-spacing: 0.04em;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .brand em {
      font-style: italic;
      font-weight: 400;
      color: var(--gold);
      margin-left: 2px;
    }
    .brand .mark {
      width: 26px;
      height: 26px;
      border: 1.2px solid var(--gold);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 12pt;
      color: var(--gold);
    }

    .eyebrow {
      margin-top: 16mm;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 11pt;
      color: var(--gold);
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }
    .eyebrow::before, .eyebrow::after {
      content: '';
      width: 28px;
      height: 1px;
      background: var(--gold);
      opacity: 0.5;
    }

    h1 {
      margin-top: 8mm;
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 30pt;
      line-height: 1.08;
      letter-spacing: -0.018em;
      color: var(--ink);
      max-width: 24ch;
    }
    h1 em {
      font-style: italic;
      font-weight: 700;
      background: linear-gradient(120deg, var(--gold-hi) 0%, var(--gold) 50%, var(--gold-lo) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--gold);
    }

    /* QR */
    .qr-wrap {
      width: 92mm;
      height: 92mm;
      background: var(--black);
      border: 1px solid var(--line);
      padding: 6mm;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .qr-caption {
      margin-top: 6mm;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 9pt;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .qr-caption::before {
      content: '';
      width: 22px;
      height: 1px;
      background: var(--gold);
    }

    .scan-line {
      margin-top: 4mm;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 14pt;
      color: var(--ink-dim);
    }

    /* BOTTOM */
    .bottom {
      width: 100%;
      text-align: center;
      padding-bottom: 4mm;
    }

    .url-line {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 18pt;
      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .meta {
      margin-top: 4mm;
      font-family: 'DM Sans', sans-serif;
      font-size: 9pt;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .gold-rule {
      width: 60px;
      height: 1px;
      background: var(--gold);
      opacity: 0.5;
      margin: 6mm auto;
    }

    @media print {
      html, body { background: var(--black); padding: 0; display: block; }
      .card { box-shadow: none; width: 210mm; height: 297mm; }
    }
  </style>
</head>
<body>

  <section class="card">

    <div class="top">
      <div class="brand">
        <span class="mark">C</span>
        Copy<em>Estratega</em>
      </div>

      <div class="eyebrow">Diagnóstico Digital · Gratuito</div>

      <h1>Encuentro el dinero que tu negocio está dejando <em>escapar online.</em></h1>
    </div>

    <div style="text-align:center;">
      <div class="qr-wrap">
        <img src="copyestratega-qr-gold.png" alt="QR copyestratega.com" />
      </div>
      <div class="qr-caption">Escanea con tu cámara</div>
      <div class="scan-line">Tu Diagnóstico Digital en menos de 24h.</div>
    </div>

    <div class="bottom">
      <div class="gold-rule"></div>
      <div class="url-line">copyestratega.com</div>
      <div class="meta">Daniel García de Celis · Copy Estratega</div>
    </div>

  </section>

</body>
</html>
