<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Copy Estratega · Instagram Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #060606; }

    :root {
      --black:   #060606;
      --ink:     #f3ede4;
      --ink-dim: #b6ada1;
      --muted:   #6e655b;
      --gold:    #c9a84c;
      --gold-hi: #e6c97a;
      --gold-lo: #8a7129;
      --line:    rgba(201, 168, 76, 0.2);
    }

    .story {
      width: 1080px;
      height: 1920px;
      background: var(--black);
      position: relative;
      overflow: hidden;
      color: var(--ink);
      font-family: 'DM Sans', system-ui, sans-serif;
      padding: 140px 90px 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    /* Grain */
    .story::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.05;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    /* Radial glow at top */
    .story::after {
      content: '';
      position: absolute;
      top: -300px;
      left: 50%;
      transform: translateX(-50%);
      width: 1400px;
      height: 1400px;
      background: radial-gradient(circle at center, rgba(201,168,76,0.18) 0%, rgba(201,168,76,0.05) 30%, transparent 60%);
      pointer-events: none;
    }

    .story > * { position: relative; z-index: 2; }

    /* TOP */
    .top { width: 100%; }

    .brand {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 38px;
      letter-spacing: 0.04em;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 18px;
    }
    .brand em {
      font-style: italic;
      font-weight: 400;
      color: var(--gold);
      margin-left: 4px;
    }
    .brand .mark {
      width: 54px;
      height: 54px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 26px;
      color: var(--gold);
    }

    .eyebrow {
      margin-top: 56px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 28px;
      color: var(--gold);
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      gap: 24px;
    }
    .eyebrow::before, .eyebrow::after {
      content: '';
      width: 56px;
      height: 1.5px;
      background: var(--gold);
      opacity: 0.55;
    }

    h1 {
      margin-top: 40px;
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 80px;
      line-height: 1.04;
      letter-spacing: -0.022em;
      color: var(--ink);
      max-width: 18ch;
    }
    h1 em {
      font-style: italic;
      font-weight: 700;
      background: linear-gradient(120deg, var(--gold-hi) 0%, var(--gold) 50%, var(--gold-lo) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--gold);
    }

    /* MIDDLE - QR */
    .mid {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-wrap {
      width: 600px;
      height: 600px;
      background: var(--black);
      border: 2px solid var(--line);
      padding: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 30px 80px -20px rgba(201,168,76,0.25);
    }
    .qr-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .scan-line {
      margin-top: 42px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 38px;
      color: var(--ink-dim);
      line-height: 1.3;
      max-width: 18ch;
    }

    .scan-caption {
      margin-top: 22px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 18px;
    }
    .scan-caption::before {
      content: '';
      width: 36px;
      height: 1.5px;
      background: var(--gold);
    }

    /* BOTTOM */
    .bottom {
      width: 100%;
      text-align: center;
    }

    .gold-rule {
      width: 90px;
      height: 1.5px;
      background: var(--gold);
      opacity: 0.6;
      margin: 0 auto 36px;
    }

    .url-line {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 52px;
      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .meta {
      margin-top: 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <section class="story">

    <div class="top">
      <div class="brand">
        <span class="mark">C</span>
        Copy<em>Estratega</em>
      </div>

      <div class="eyebrow">Diagnóstico Digital · Gratuito</div>

      <h1>Encuentro el dinero que tu negocio está dejando <em>escapar online.</em></h1>
    </div>

    <div class="mid">
      <div class="qr-wrap">
        <img src="copyestratega-qr-gold.png" alt="QR copyestratega.com" />
      </div>
      <div class="scan-line">Escanea y recíbelo en menos de 24h.</div>
      <div class="scan-caption">Apunta tu cámara</div>
    </div>

    <div class="bottom">
      <div class="gold-rule"></div>
      <div class="url-line">copyestratega.com</div>
      <div class="meta">Daniel García de Celis</div>
    </div>

  </section>

</body>
</html>
