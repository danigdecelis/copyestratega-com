<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#060606" />
  <title>Copy Estratega · Escanea · Empresas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #060606;
      --ink:     #f3ede4;
      --ink-dim: #b6ada1;
      --muted:   #6e655b;
      --gold:    #c9a84c;
      --gold-hi: #e6c97a;
      --gold-lo: #8a7129;
      --line:    rgba(201, 168, 76, 0.2);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--black);
      color: var(--ink);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(24px, 6vh, 48px) clamp(20px, 6vw, 40px);
      position: relative;
    }

    /* Grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.045;
      pointer-events: none;
      mix-blend-mode: overlay;
      z-index: 0;
    }

    /* Top gold radial glow */
    body::after {
      content: '';
      position: fixed;
      top: -30vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(120vw, 900px);
      height: min(120vw, 900px);
      background: radial-gradient(circle at center, rgba(201,168,76,0.16) 0%, rgba(201,168,76,0.04) 35%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    body > * { position: relative; z-index: 1; }

    /* ── TOP ── */
    .top {
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(18px, 2.5vh, 28px);
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(15px, 2.2vh, 20px);
      letter-spacing: 0.04em;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .brand em {
      font-style: italic;
      font-weight: 400;
      color: var(--gold);
      margin-left: 3px;
    }
    .brand .mark {
      width: clamp(24px, 3vh, 30px);
      height: clamp(24px, 3vh, 30px);
      border: 1.5px solid var(--gold);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(11px, 1.5vh, 14px);
      color: var(--gold);
    }

    .eyebrow {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(13px, 1.8vh, 17px);
      color: var(--gold);
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      gap: clamp(10px, 1.5vw, 16px);
    }
    .eyebrow::before, .eyebrow::after {
      content: '';
      width: clamp(20px, 3vw, 32px);
      height: 1px;
      background: var(--gold);
      opacity: 0.55;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: clamp(26px, 4.5vh, 44px);
      line-height: 1.06;
      letter-spacing: -0.018em;
      color: var(--ink);
      max-width: 18ch;
    }
    h1 em {
      font-style: italic;
      font-weight: 700;
      background: linear-gradient(120deg, var(--gold-hi) 0%, var(--gold) 50%, var(--gold-lo) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--gold);
    }

    /* ── QR (centro) ── */
    .qr-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(20px, 3vh, 28px);
    }

    .qr-wrap {
      width: min(72vw, 56vh, 380px);
      height: min(72vw, 56vh, 380px);
      background: var(--black);
      border: 1px solid var(--line);
      padding: clamp(12px, 1.8vh, 20px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 20px 60px -15px rgba(201,168,76,0.22),
        0 0 0 1px rgba(201,168,76,0.06);
    }
    .qr-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    .scan-line {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(16px, 2.4vh, 22px);
      color: var(--ink-dim);
      line-height: 1.3;
      text-align: center;
      max-width: 22ch;
    }

    /* ── BOTTOM ── */
    .bottom {
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 1vh, 12px);
    }

    .gold-rule {
      width: 50px;
      height: 1px;
      background: var(--gold);
      opacity: 0.5;
      margin-bottom: clamp(6px, 1vh, 12px);
    }

    .url-line {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(18px, 2.8vh, 26px);
      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .meta {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(10px, 1.4vh, 12px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Fullscreen hint (oculto en fullscreen) */
    .fs-hint {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 5;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      padding: 8px 12px;
      border-radius: 2px;
      cursor: pointer;
      transition: opacity 0.3s, color 0.2s;
    }
    .fs-hint:hover { color: var(--gold); }
    body.fs .fs-hint { opacity: 0; pointer-events: none; }

    /* Landscape (portátil/tablet apaisado): layout horizontal */
    @media (orientation: landscape) and (min-width: 800px) {
      body {
        flex-direction: row;
        justify-content: center;
        gap: clamp(40px, 6vw, 80px);
        padding: clamp(32px, 6vh, 60px);
      }
      .top, .bottom {
        width: auto;
        max-width: 38vw;
        text-align: left;
        align-items: flex-start;
        justify-content: center;
      }
      .top { flex: 1; }
      .qr-block { width: auto; flex-shrink: 0; }
      .qr-wrap {
        width: min(70vh, 460px);
        height: min(70vh, 460px);
      }
      .gold-rule { margin: 0 0 16px; }
      .bottom { flex: 1; align-items: flex-end; text-align: right; }
    }
  </style>
</head>
<body>

  <button class="fs-hint" onclick="toggleFullscreen()">Pantalla completa</button>

  <div class="top">
    <div class="brand">
      <span class="mark">C</span>
      Copy<em>Estratega</em>
    </div>

    <div class="eyebrow">Diagnóstico para empresas · Gratuito</div>

    <h1>Encuentro las ventas que tu empresa está dejando <em>escapar.</em></h1>
  </div>

  <div class="qr-block">
    <div class="qr-wrap">
      <img src="/qr/empresas-qr.png" alt="QR diagnóstico empresas copyestratega.com" />
    </div>
    <div class="scan-line">Apunta tu cámara y escríbeme. Te respondo en menos de 24h.</div>
  </div>

  <div class="bottom">
    <div class="gold-rule"></div>
    <div class="url-line">copyestratega.com/empresas</div>
    <div class="meta">Daniel García de Celis</div>
  </div>

  <script>
    // Toggle fullscreen
    function toggleFullscreen() {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen).call(el);
        document.body.classList.add('fs');
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen).call(document);
        document.body.classList.remove('fs');
      }
    }
    document.addEventListener('fullscreenchange', () => {
      document.body.classList.toggle('fs', !!document.fullscreenElement);
    });

    // Prevent accidental scroll/zoom on mobile
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('touchmove', e => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // Keep screen awake (mobile) — best effort
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }
    requestWakeLock();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
  </script>

</body>
</html>
